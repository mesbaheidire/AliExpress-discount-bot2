services:
  - type: web
    name: aliexpress-telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 start_bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_TOKEN
        sync: false
      - key: APP_KEY
        sync: false
      - key: APP_SECRET
        sync: false
 
 
